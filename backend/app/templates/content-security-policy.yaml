id: swot-missing-csp
info:
  name: HTML response without Content-Security-Policy
  author: swot
  severity: info
  description: An HTML response has no Content-Security-Policy header. Assess policy requirements in context; this alone is not proof of an exploitable vulnerability.
  tags: headers,config
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status: [200]
      - type: word
        part: header
        words: ["text/html"]
        case-insensitive: true
      - type: word
        part: header
        words: ["content-security-policy:"]
        case-insensitive: true
        negative: true
